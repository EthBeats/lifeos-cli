[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lifeos"
version = "0.1.0"
description = "A private & local agentic LifeOS CLI running on MacOS and Ollama."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "ics>=0.7.2",
    "sqlmodel>=0.0.16",
    "pyobjc-framework-EventKit; sys_platform == 'darwin'"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0"
]

[project.scripts]
lifeos = "lifeos.cli.main:app"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
